<app-navbar></app-navbar>
<main class="with-sidebar">
    <div class="container ">
        <div class="row mx-3 mx-md-5 mt-5 justify-content-center">
            <div class="col-12 col-md-10 ">
                <h3 class="mb-5 mt-3" i18n="@@guests-header">Guest list</h3>
            </div>
        </div>
        <div class="row mx-3 mx-md-5 mb-2 justify-content-center">
            <div class="col-10 col-md-3">
                <div class="card text-bg-dark mb-3">
                    <div class="card-header" i18n="@@guests-total">Total</div>
                    <div class="fs-2 text-center pb-3">{{ guests.length }}</div>
                </div>
            </div>
            <div class="col-10 col-md-3">
                <div class="card text-bg-secondary mb-3">
                    <div class="card-header" i18n="@@guests-confirmed">Confirmed</div>
                    <div class="fs-2 text-center pb-3">{{confirmed }}</div>
                </div>
            </div>
            <div class="col-10 col-md-3">
                <div class="card text-bg-danger mb-3">
                    <div class="card-header" i18n="@@guests-declined">Declined</div>
                    <div class="fs-2 text-center pb-3">{{ declined }}</div>

                </div>
            </div>
        </div>
    </div>
    <div class="row mx-3 mx-md-5 mb-2 justify-content-center">
        <div class="col-12 col-md-10 ">
            <div class="d-flex justify-content-end">
                <button (click)="openGuestForm(content)" class="btn btn-outline-dark" i18n="@@button-add-guest"><i
                        class="bi bi-plus-circle-dotted"></i> Add
                    guest</button>
            </div>
        </div>
    </div>

    <div class="row mx-3 mx-md-5 justify-content-center">
        <div class="col-12 col-md-10 ">
            <table class="table table-responsive-sm">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col" i18n="@@guests-name">First</th>
                        <th scope="col" i18n="@@guests-surname">Last</th>
                        <th scope="col" i18n="@@guests-gender">Gender</th>
                        <th scope="col" i18n="@@guests-RVSP">RVSP status</th>
                        <th scope="col" i18n="@@guests-email">Email</th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    <div class="mt-3" *ngIf="guests.length===0" i18n="@@empty-list">
                        Empty list
                    </div>
                    <tr *ngFor="let guest of guests; let i = index">
                        <th scope="row">{{ i+1 }}</th>
                        <td>{{ guest.name }}</td>
                        <td>{{ guest.surname }}</td>
                        <td> <i class="bi bi-person-standing-dress" *ngIf="guest.gender === 'WOMAN'"></i>
                            <i class="bi bi-person-standing" *ngIf="guest.gender === 'MAN'"></i>
                        </td>
                        <td><span class="badge" [ngClass]="getBadgeBg(guest.rvspStatus)">{{ getLocalizedStatus(
                                guest.rvspStatus )}}</span>
                        </td>
                        <td>{{ guest.email }}</td>
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-link link-dark dropdown-toggle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu  dropdown-menu-end">
                                    <li><button class="dropdown-item" type="button"
                                            (click)="editGuest(guest); openGuestForm(content)"
                                            i18n="@@button-edit">Edit</button></li>
                                    <li><button class="dropdown-item link-danger" type="button"
                                            (click)="deleteGuest(guest.id)" i18n="@@button-delete">Delete</button></li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<ng-template #content let-offcanvas>
    <div class="offcanvas-header">
        <h4 class="offcanvas-title" id="offcanvas-basic-title" i18n="@@guest-profile">Profile update</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="offcanvas.dismiss('Cross click')"></button>
    </div>
    <div class="offcanvas-body">
        <form #guestForm="ngForm" class="row g-3 mb-3" (submit)="onSubmit(offcanvas)">

            <div class="mb-3">
                <label for="inputName" class="form-label" i18n="@@guest-name">Name</label>
                <input type="text" class="form-control" id="inputName" [(ngModel)]="newGuest.name" name="name"
                    placeholder="Enter guest name" i18n-placeholder="@@guest-name-placeholder">
            </div>
            <div class="mb-3">
                <label for="inputSurname" class="form-label" i18n="@@guest-surname">Surname</label>
                <input type="text" class="form-control" id="inputSurname" [(ngModel)]="newGuest.surname" name="surname"
                    placeholder="Enter guest surname" i18n-placeholder="@@guest-surname-placeholder">
            </div>
            <div class="mb-3">
                <label for="inputGender" class="form-label" i18n="@@guest-gender">Gender</label>
                <select class="form-select" id="inputGender" [(ngModel)]="newGuest.gender" name="gender">
                    <option value="undefined" i18n="@@guest-gender-placeholder" selected="selected">Select guest gender
                    </option>
                    <option value="WOMAN" i18n="@@gender-woman">Woman</option>
                    <option value="MAN" i18n="@@gender-man">Man</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="inputEmail" class="form-label">Email</label>
                <input type="text" class="form-control" id="inputEmail" [(ngModel)]="newGuest.email" name="email"
                    placeholder="Enter guest email" i18n-placeholder="@@guest-email-placeholder">
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-dark" i18n="@@button-save">Save</button>
            </div>

        </form>
    </div>
</ng-template>
