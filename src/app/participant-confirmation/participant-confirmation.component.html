<app-navbar [withSidebar]="false"></app-navbar>
<main>
    <div class="container">
        <div class="row">
            <div class="col my-6 d-flex justify-content-center text-center flex-column">
                <h3 class="mt-5" [ngClass]="!isLoading? 'text-danger' : ''"> {{ processingMessage }}</h3>
                <div class="d-flex justify-content-center flex-column " *ngIf=" isLoading">
                    <div class="spinner-border m-auto mt-3" role="status">
                    </div>
                    <!-- <div class="circle m-auto" *ngIf="!isLoading">
                        <div class=" checkmark"></div>
                    </div> -->
                </div>
            </div>
        </div>
    </div>
</main>
