<router-outlet></router-outlet>

<div class="position-fixed bottom-0 end-0 p-3">
    <ngb-toast class="mb-1" *ngFor="let toast of appMessageService.getMessages()" [class]="toast.classname"
        [autohide]="true" [delay]="4000" (hidden)="appMessageService.remove(toast)">
        {{toast.message}}
    </ngb-toast>
</div>
